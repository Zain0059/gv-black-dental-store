query ListProducts @auth(expr: "auth.uid != nil") {
  products(
    where: { active: { eq: true } }
    orderBy: [{ name: ASC }]
  ) {
    id
    sku
    name
    manufacturer
    gtin
    unitPrice
    stockQty
  }
}

query ListCustomers @auth(expr: "auth.uid != nil") {
  customers(where: { active: { eq: true } }, orderBy: [{ name: ASC }]) {
    id
    name
    phone
    email
    openingBalance
  }
}

query ListInvoices @auth(expr: "auth.uid != nil") {
  invoices(orderBy: [{ createdAt: DESC }], limit: 100) {
    id
    invoiceNo
    status
    total
    createdAt
    customer {
      id
      name
    }
    payments {
      amount
      method
      receivedAt
    }
    invoiceItems {
      quantity
      unitPrice
      skuSnapshot
      nameSnapshot
    }
  }
}

mutation BootstrapStoreUser($displayName: String!, $email: String!) @auth(expr: "auth.uid != nil") {
  storeUser_insert(data: {
    uid_expr: "auth.uid"
    displayName: $displayName
    email: $email
    role: "sales"
    active: true
  }) {
    uid
    role
  }
}

mutation CreateProduct(
  $data: Product_Data! @allow(fields: "sku name manufacturer gtin unitPrice active", maxCount: 1)
) @auth(level: USER) @transaction {
  storeUser(key: { uid_expr: "auth.uid" }) @redact {
    role @check(expr: "this == 'owner' || this == 'manager'")
    active @check(expr: "this == true")
  }
  product_insert(data: $data) {
    id
    sku
    name
  }
}

mutation CreateCustomer(
  $data: Customer_Data! @allow(fields: "name phone email address active", maxCount: 1)
) @auth(level: USER) @transaction {
  storeUser(key: { uid_expr: "auth.uid" }) @redact {
    role @check(expr: "this == 'owner' || this == 'manager' || this == 'sales'")
    active @check(expr: "this == true")
  }
  customer_insert(data: $data) {
    id
    name
  }
}
