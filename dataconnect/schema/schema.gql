type StoreUser @table(key: "uid", name: "store_user") {
  uid: String!
  displayName: String!
  email: String! @unique
  role: String! @default(value: "sales")
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
}

type Product @table {
  sku: String! @unique
  name: String!
  manufacturer: String
  gtin: String @unique
  unitPrice: Float! @col(dataType: "numeric(12,2)") @default(value: 0)
  stockQty: Float! @col(dataType: "numeric(12,3)") @default(value: 0)
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
  updatedAt: Timestamp! @default(expr: "request.time")
}

type Customer @table {
  name: String!
  phone: String
  email: String
  address: String
  openingBalance: Float! @col(dataType: "numeric(12,2)") @default(value: 0)
  active: Boolean! @default(value: true)
  createdAt: Timestamp! @default(expr: "request.time")
}

type Invoice @table {
  invoiceNo: String! @unique
  customer: Customer! @ref(fields: "customerId")
  customerId: UUID!
  createdByUid: String!
  status: String! @default(value: "issued")
  total: Float! @col(dataType: "numeric(12,2)")
  createdAt: Timestamp! @default(expr: "request.time")
}

type InvoiceItem @table {
  invoice: Invoice! @ref(fields: "invoiceId")
  invoiceId: UUID!
  product: Product! @ref(fields: "productId")
  productId: UUID!
  skuSnapshot: String!
  nameSnapshot: String!
  quantity: Float! @col(dataType: "numeric(12,3)")
  unitPrice: Float! @col(dataType: "numeric(12,2)")
}

type Payment @table {
  invoice: Invoice! @ref(fields: "invoiceId")
  invoiceId: UUID!
  receivedByUid: String!
  amount: Float! @col(dataType: "numeric(12,2)")
  method: String! @default(value: "cash")
  receivedAt: Timestamp! @default(expr: "request.time")
}

type StockMovement @table {
  product: Product! @ref(fields: "productId")
  productId: UUID!
  createdByUid: String!
  quantityDelta: Float! @col(dataType: "numeric(12,3)")
  reason: String!
  invoice: Invoice @ref(fields: "invoiceId")
  invoiceId: UUID
  createdAt: Timestamp! @default(expr: "request.time")
}
