# Replace region and instance ID after creating the Firebase SQL Connect project.
serviceId: gv-black-dental-store
location: YOUR_SQL_CONNECT_REGION
schema:
  source: "./schema"
  datasource:
    postgresql:
      database: postgres
      cloudSql:
        instanceId: YOUR_CLOUD_SQL_INSTANCE_ID
        schemaValidation: "COMPATIBLE"
connectorDirs:
  - "./connector"
